# Builds the game and publishes it to GitHub Pages on every push to main.
# Settings → Pages → Source: "GitHub Actions".
# Settings → Secrets and variables → Actions → Variables: VITE_API_BASE_URL (and optionally the others below).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Test shared rules
        run: npm test
      - name: Build
        run: npm run build:pages
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_AUTH: ${{ vars.VITE_API_AUTH || 'bearer' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'wss://gameserver.rastar.ir' }}
          VITE_ROOM_NAME: ${{ vars.VITE_ROOM_NAME || 'blocksy' }}
          VITE_TOKEN_PATH: ${{ vars.VITE_TOKEN_PATH }}
          VITE_AUTH_OTP_SEND_PATH: ${{ vars.VITE_AUTH_OTP_SEND_PATH }}
          VITE_AUTH_OTP_VERIFY_PATH: ${{ vars.VITE_AUTH_OTP_VERIFY_PATH }}
          VITE_ME_PATH: ${{ vars.VITE_ME_PATH }}
          VITE_ROOMS_PATH: ${{ vars.VITE_ROOMS_PATH }}
          VITE_ROOM_PATH: ${{ vars.VITE_ROOM_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
